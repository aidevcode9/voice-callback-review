[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-callback-review"
version = "0.1.0"
description = "Local callback review diagnostics and model-independent contracts"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
voice-callback = "voice_callback.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
