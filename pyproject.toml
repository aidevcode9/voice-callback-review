[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-callback-review"
version = "0.1.0"
description = "Local callback review diagnostics and model-independent contracts"
requires-python = ">=3.10"
dependencies = ["pydantic==2.14.3", "fastapi==0.162.0", "uvicorn==0.54.0"]

[project.scripts]
voice-callback = "voice_callback.cli:main"
voice-callback-api = "voice_callback.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_callback = ["prompts/*.txt"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "scripts", "tests"]
strict = ["src/voice_callback"]
extraPaths = ["src", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.coverage.run]
branch = true
source = ["voice_callback"]
data_file = ".test-work/.coverage"

[tool.coverage.report]
show_missing = true
